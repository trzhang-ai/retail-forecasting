[project]
name = "revenue-forecasting"
version = "0.1.0"
description = "December 2026 revenue forecast: statistical, neural, and foundation-model evaluation with a planning recommendation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.3.2",
    "darts[torch]>=0.47.0",
    "matplotlib>=3.11.2",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
